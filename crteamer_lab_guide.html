
<h2 class="sr-only">CRTeamer practice lab guide — interactive phase-to-lab mapping</h2>

<style>
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .pill{padding:5px 12px;border-radius:20px;border:0.5px solid var(--border);background:var(--surface-1);color:var(--text-secondary);font-size:12px;cursor:pointer;transition:all .15s}
  .pill.on{background:var(--bg-accent);color:var(--text-accent);border-color:var(--border-accent)}
  .phase-row{border:0.5px solid var(--border);border-radius:10px;margin-bottom:8px;overflow:hidden}
  .phase-head{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;background:var(--surface-1)}
  .phase-head:hover{background:var(--surface-2)}
  .ph-num{font-size:11px;font-weight:500;color:var(--text-accent);background:var(--bg-accent);padding:2px 7px;border-radius:12px;white-space:nowrap}

  .ph-chevron{font-size:13px;color:var(--text-secondary);transition:transform .2s}

  .lab-name{font-size:12px;font-weight:500;color:var(--text-primary);margin-bottom:3px}
  .lab-sub{font-size:11px;color:var(--text-secondary);margin-bottom:6px}
  .tags{display:flex;gap:4px;flex-wrap:wrap}
  .tag{font-size:10px;padding:1px 6px;border-radius:8px;font-weight:500}
  .tag-free{background:#EAF3DE;color:#3B6D11}
  .tag-paid{background:#FAEEDA;color:#854F0B}
  .tag-local{background:#EEEDFE;color:#534AB7}
  .tag-thm{background:#E6F1FB;color:#185FA5}
  .tag-htb{background:#FAECE7;color:#993C1D}
  .tag-easy{background:#E1F5EE;color:#0F6E56}
  .tag-medium{background:#FAEEDA;color:#854F0B}
  .tag-hard{background:#FCEBEB;color:#A32D2D}
  .legend{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;font-size:11px}
  .legend span{display:flex;align-items:center;gap:4px;color:var(--text-secondary)}
  .summary-bar{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
  .sum{background:var(--surface-1);border:0.5px solid var(--border);border-radius:8px;padding:10px;text-align:center}
  .sum-n{font-size:20px;font-weight:500;color:var(--text-primary)}
  .sum-l{font-size:11px;color:var(--text-secondary);margin-top:2px}
  .empty{padding:16px;text-align:center;color:var(--text-secondary);font-size:13px;display:none}
</style>

<div class="filters" id="filters">

  <button class="pill" data-f="thm">TryHackMe</button>

  <button class="pill" data-f="local">Local lab</button>

<div class="legend">

let activeFilter = 'all';

function tagClass(plat){ return plat==='thm'?'tag-thm':plat==='htb'?'tag-htb':'tag-local'; }
function costClass(c){ return c==='free'?'tag-free':'tag-paid'; }
function diffClass(d){ return d==='easy'?'tag-easy':d==='medium'?'tag-medium':'tag-hard'; }
function diffLabel(d){ return d==='easy'?'Beginner':d==='medium'?'Intermediate':'Advanced'; }
function platLabel(p){ return p==='thm'?'THM':p==='htb'?'HTB':'LOCAL'; }

function matches(lab){
  if(activeFilter==='all') return true;
  if(activeFilter==='thm') return lab.plat==='thm';
  if(activeFilter==='htb') return lab.plat==='htb';
  if(activeFilter==='local') return lab.plat==='local';
  if(activeFilter==='free') return lab.cost==='free';
  if(activeFilter==='easy') return lab.diff==='easy';
  if(activeFilter==='medium') return lab.diff==='medium';
  if(activeFilter==='hard') return lab.diff==='hard';
  return true;
}

function render(){
  const list = document.getElementById('phases-list');
  const empty = document.getElementById('empty-msg');
  let totalVisible=0, freeVisible=0, paidVisible=0;
  list.innerHTML='';

  phases.forEach((ph,idx)=>{
    const visLabs = ph.labs.filter(matches);
    if(visLabs.length===0) return;
    totalVisible+=visLabs.length;
    visLabs.forEach(l=>{ if(l.cost==='free') freeVisible++; else paidVisible++; });

    const row = document.createElement('div');
    row.className='phase-row';

    const head = document.createElement('div');
    head.className='phase-head';
    head.innerHTML=`<span class="ph-num">Phase ${ph.num}</span><span class="ph-title">${ph.title}</span><i class="ti ti-chevron-down ph-chevron" aria-hidden="true"></i>`;

    const grid = document.createElement('div');
    grid.className='labs-grid';

    visLabs.forEach(lab=>{
      const card=document.createElement('div');
      card.className='lab-card';
      card.innerHTML=`<div class="lab-name">${lab.name}</div><div class="lab-sub">${lab.sub}</div><div class="tags"><span class="tag ${tagClass(lab.plat)}">${platLabel(lab.plat)}</span><span class="tag ${costClass(lab.cost)}">${lab.cost.toUpperCase()}</span><span class="tag ${diffClass(lab.diff)}">${diffLabel(lab.diff)}</span></div>`;
      if(lab.url) card.onclick=()=>window.open(lab.url,'_blank');
      else card.onclick=()=>sendPrompt(`Walk me through setting up the ${lab.name} for Phase ${ph.num}`);
      grid.appendChild(card);
    });

    head.onclick=()=>{
      const isOpen=grid.classList.contains('open');
      grid.classList.toggle('open',!isOpen);
      head.querySelector('.ph-chevron').classList.toggle('open',!isOpen);
    };

    row.appendChild(head); row.appendChild(grid);
    list.appendChild(row);

    if(activeFilter!=='all' || idx<2){
      grid.classList.add('open');
      head.querySelector('.ph-chevron').classList.add('open');
    }
  });

  document.getElementById('total-labs').textContent=totalVisible;
  document.getElementById('free-labs').textContent=freeVisible;
  document.getElementById('paid-labs').textContent=paidVisible;
  empty.style.display = totalVisible===0 ? 'block' : 'none';
}

document.getElementById('filters').addEventListener('click',e=>{
  const btn=e.target.closest('[data-f]');
  if(!btn) return;
  document.querySelectorAll('.pill').forEach(p=>p.classList.remove('on'));
  btn.classList.add('on');
  activeFilter=btn.dataset.f;
  render();
});

render();
</script>
